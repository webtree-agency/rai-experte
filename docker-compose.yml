# BURGMEIJER RAI-Experte — Full-Stack-Deploy für Dokploy (Database + App).
#
# In Dokploy: "Compose"-Service anlegen, dieses Repo verbinden, die Variablen
# unten als Environment setzen, Domain auf den `app`-Service (Port 3000) mappen.
#
# Lokaler Smoke-Test:
#   docker network create dokploy-network   # einmalig
#   PAYLOAD_SECRET=... NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
#   PREVIEW_HOST=localhost docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: ${POSTGRES_DB:-rai_experte}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-rai_experte}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-rai_experte}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Inhalte beim ersten Deploy seeden, danach in Dokploy auf false.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # Resend-Mailing (Kontakt + Anmeldungen). Ohne diese: Eintrag wird
      # gespeichert, aber KEINE Mail versendet (stiller No-op).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      # R2 / S3 Media-Storage. Leer lassen → lokale Uploads (Volume).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_PREFIX: ${S3_PREFIX:-rai-experte}
    volumes:
      # Persistiert lokale Uploads über Redeploys, falls KEIN S3 genutzt wird.
      - uploads_data:/app/public/uploads
    expose:
      - '3000'
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.rai-experte.rule=Host(`${PREVIEW_HOST}`)
      - traefik.http.routers.rai-experte.entrypoints=websecure
      - traefik.http.routers.rai-experte.tls.certResolver=letsencrypt
      - traefik.http.services.rai-experte.loadbalancer.server.port=3000

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
  dokploy-network:
    external: true
